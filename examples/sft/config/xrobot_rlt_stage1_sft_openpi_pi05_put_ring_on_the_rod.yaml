defaults:
  - model/pi0_5_rlinf_xrobot@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - _self_
  - rlt/stage1_rlt_openpi_pi05_common
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: ${oc.env:COBOT_GPU_ID,0}

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: RLinf_rlt_stage1
    experiment_name: "xrobot_rlt_stage1_put_ring_on_the_rod"
    logger_backends: ["wandb", "tensorboard"]

  max_epochs: -1
  max_steps: 30000
  val_check_interval: -1
  save_interval: 5000

data:
  train_data_paths: "xrobot/put_ring_on_the_rod"
  num_workers: 8
  include_failure_episodes: false

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  # Align with Cobot Stage-1 RLT / regular SFT throughput settings.
  micro_batch_size: 64
  global_batch_size: 64
  seed: 0

  model:
    precision: bf16
    model_path: "/data/gxy/realworldRL/RLinf/logs/20260826-034102-xrobot_sft_openpi_rlinf_pi05_put_ring_on_the_rod-gpu7/xrobot_dual_arm_ee_pi05_put_ring_on_rod_sft/checkpoints/global_step_30000/actor/model_state_dict"
    num_action_chunks: 50
    action_dim: 14
    add_value_head: False
    openpi:
      task: sft
      config_name: "pi05_xrobot"
      assets_dir: /data/gxy/realworldRL/checkpoints/assets
      asset_id: "xrobot/put_ring_on_the_rod"
      num_images_in_input: 3
      discrete_state_input: True
      max_token_len: 200
      model_action_dim: 32
    openpi_data:
      default_prompt: "put ring on the rod"
      norm_stats_path: /data/gxy/realworldRL/checkpoints/assets/xrobot/put_ring_on_the_rod/norm_stats.json

  optim:
    lr: 1.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1e-10
    clip_grad: 1.0
    total_training_steps: 30000
    lr_warmup_steps: 1000
    lr_scheduler: "openpi_cosine"
    num_cycles: 0.5
    min_lr: 2.5e-6

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: True
    gradient_checkpointing: True
    gradient_checkpointing_use_reentrant: False
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32

reward:
  use_reward_model: False

critic:
  use_critic_model: False
