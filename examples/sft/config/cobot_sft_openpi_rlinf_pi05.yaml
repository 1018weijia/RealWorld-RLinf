defaults:
  - model/pi0_5_rlinf_cobot@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  # Physical GPU index for single-GPU SFT (e.g. 2). Or use run_cobot_sft.sh
  # with a GPU id; do not rely on CUDA_VISIBLE_DEVICES — RLinf overwrites it.
  component_placement:
    actor,env,rollout: 0

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: RLinf_pi05_cobot_pick
    experiment_name: "cobot_pi05_openpi_rlinf_sft"
    logger_backends: ["wandb"]

  max_epochs: -1
  max_steps: 30000
  val_check_interval: -1
  save_interval: 5000

data:
  # HF-style repo id under HF_LEROBOT_HOME (symlink created during setup).
  train_data_paths: "cobot_magic/cube_into_drawer"
  # torchcodec decode workers. Pair with OMP/MKL=1 (see env_ffmpeg_torchcodec.sh
  # and worker_init_fn) so workers scale out instead of oversubscribing threads.
  num_workers: 24

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 64
  global_batch_size: 64
  seed: 0

  model:
    precision: bf16
    model_path: "/data/gxy/realworldRL/checkpoints/pi05_base_openpi_rlinf"
    num_action_chunks: 50
    action_dim: 14
    add_value_head: False
    openpi:
      task: sft
      config_name: "pi05_cobot_magic"
      assets_dir: /data/gxy/realworldRL/checkpoints/assets
      asset_id: "cobot_magic/cube_into_drawer"
      num_images_in_input: 3
      discrete_state_input: True
      max_token_len: 200
      model_action_dim: 32
    openpi_data:
      norm_stats_path: /data/gxy/realworldRL/checkpoints/assets/cobot_magic/cube_into_drawer/norm_stats.json

  optim:
    lr: 2.5e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1e-10
    clip_grad: 1.0
    total_training_steps: 30000
    lr_warmup_steps: 1000
    lr_scheduler: "openpi_cosine"
    num_cycles: 0.5
    min_lr: 2.5e-6

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: True
    gradient_checkpointing: True
    gradient_checkpointing_use_reentrant: False
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32

reward:
  use_reward_model: False

critic:
  use_critic_model: False
