defaults:
  - model/pi0_5_pytorch_franka_shuo@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

# VLA-only pi05 SFT migrated from RL-Token ``exp/stage1_shuo_ddp.sh``.
# This does NOT train the RL-token head (set openpi.use_rlt=True for that).
# Compute norm stats before the first run:
#   python toolkits/lerobot/calculate_norm_stats.py \
#       --config-name pi05_franka_shuo \
#       --repo-id /vast/users/xiaodan/zhangjian/RealRL/FR3_A1/stack_bowls_in_size_order_rc
# Put the result at <assets_dir>/fr3_a1_three_tasks_franka_ee/norm_stats.json
# (or pass actor.model.openpi_data.norm_stats_path).

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "sft_franka_shuo_pi05"
    logger_backends: ["tensorboard", "wandb"]

  max_epochs: -1
  max_steps: 30000
  val_check_interval: -1
  save_interval: 1000
  resume_dir: /vast/users/xiaodan/zhangjian/RealRL/rlinf/logs/sft/20260826-163605-franka_pi05_rlinf_d2/sft_franka_shuo_pi05/checkpoints/global_step_15000

data:
  # Same mix as stage1_shuo_ddp.sh (commented fruits/charger/peg set).
  # Official OpenPI ConcatDataset + balance_datasets=True equalizes
  # per-dataset sampling (not the 1:0.5:0.5:0.5:0.5 weights used by
  # RL-Token's WeightedRandomSampler).
  train_data_paths:
    - /vast/users/xiaodan/zhangjian/RealRL/FR3_A1/place_fruits_on_plate_rc
    - /vast/users/xiaodan/zhangjian/RealRL/FR3_A1/plug_charger_into_socket_rc
    - /vast/users/xiaodan/zhangjian/RealRL/FR3_A1/new_side/plug_charger_into_socket_new_side_rc
    - /vast/users/xiaodan/zhangjian/RealRL/FR3_A1/insert_peg_into_hole_rc
    - /vast/users/xiaodan/zhangjian/RealRL/FR3_A1/new_side/insert_peg_into_hole_new_side_rc
  num_workers: 8

algorithm:
  adv_type: gae

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 32 #48
  eval_batch_size: 1
  global_batch_size: 256 #384
  seed: 42

  model:
    model_path: /vast/users/xiaodan/zhangjian/RealRL/pi05_base_openpi_rlinf #/path/to/pi05_base_pytorch_new
    openpi:
      # Used by eval/RL transform loading. Official SFT also honors these via
      # openpi_data below; keep them in sync with asset_id on TrainConfig.
      assets_dir: /vast/users/xiaodan/zhangjian/RealRL/pi05_base_openpi_rlinf/assets #/vast/users/xiaodan/zhangjian/RealRL/pi05_droid_pytorch
      asset_id: "franka_shuo_fruits_charger_peg"
    openpi_data:
      asset_id: "franka_shuo_fruits_charger_peg"
      # Stats live under assets/, not model_path/<asset_id>/.
      norm_stats_path: /vast/users/xiaodan/zhangjian/RealRL/pi05_base_openpi_rlinf/assets/franka_shuo_fruits_charger_peg/norm_stats.json

  optim:
    lr: 2.5e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1e-10
    clip_grad: 1.0
    total_training_steps: 30000
    lr_warmup_steps: 1000
    lr_scheduler: "openpi_cosine"
    num_cycles: 0.5
    min_lr: 0.0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    use_orig_params: True
    gradient_checkpointing: True
    gradient_checkpointing_use_reentrant: False
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32

reward:
  use_reward_model: False

critic:
  use_critic_model: False
