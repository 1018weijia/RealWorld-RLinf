model_type: "openpi_rlinf"

# Pi0.5 JAX-aligned PyTorch model-shape template for Dobot SFT.
# Filesystem paths are supplied by dobot_sft_openpi_rlinf_pi05_*.yaml.
precision: fp32

is_lora: False
lora_rank: 32

# Dobot uses native 14-D joint+gripper actions; pad to 32.
num_action_chunks: 50
action_dim: 14
use_proprio: True
num_steps: 5
add_value_head: False

openpi:
  task: sft
  config_name: "pi05_dobot"
  num_images_in_input: 3
  action_chunk: ${..num_action_chunks}
  action_env_dim: ${..action_dim}
  model_action_dim: 32
  paligemma_variant: "gemma_2b"
  action_expert_variant: "gemma_300m"
  max_token_len: 200
  discrete_state_input: True
