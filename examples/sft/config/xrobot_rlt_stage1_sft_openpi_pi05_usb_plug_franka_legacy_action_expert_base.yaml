defaults:
  - model/pi0_5_rlinf_xrobot@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - _self_
  - rlt/stage1_franka_legacy_action_expert_common
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

# Franka-aligned legacy RLT Stage-1, adapted to XRobot usb_plug.
# Cold Stage-1 start from the base Pi0.5 checkpoint (same as put_ring).
# vla_finetune_scope: action_expert (freeze VLM, train action expert + RLT).

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: ${oc.env:XROBOT_GPU_ID,0}

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: RLinf_rlt_stage1
    experiment_name: "xrobot_usb_plug_franka_legacy_actionexpert_base_fp32master_bf16compute_30k"
    logger_backends: ["wandb", "tensorboard"]
  max_epochs: -1
  max_steps: 30000
  val_check_interval: -1
  save_interval: 5000

data:
  # Use the v30 dataset with Aloha-style camera keys (head/left_arm/right_arm).
  # lerobot_home/xrobot/usb_plug still has legacy top/left/right column names.
  train_data_paths: "/data/gxy/realworldRL/datasets/XRobot_USB_v30/XRobot_USB"
  num_workers: 8
  include_failure_episodes: false

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 32
  global_batch_size: 256
  seed: 42

  model:
    precision: fp32
    model_path: "/data/gxy/realworldRL/checkpoints/pi05_base_openpi_rlinf"
    num_action_chunks: 50
    action_dim: 14
    add_value_head: False
    openpi:
      task: sft
      config_name: "pi05_xrobot"
      assets_dir: /data/gxy/realworldRL/checkpoints/assets
      asset_id: "xrobot/usb_plug"
      num_images_in_input: 3
      discrete_state_input: True
      max_token_len: 200
      model_action_dim: 32
    openpi_data:
      default_prompt: "Bimanual usb pick and insert"
      norm_stats_path: /data/gxy/realworldRL/checkpoints/assets/xrobot/usb_plug/norm_stats.json

  optim:
    lr: 2.5e-5
    rlt_lr: 2.5e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1e-10
    clip_grad: 1.0
    clip_grad_by_optimizer_group: false
    total_training_steps: 30000
    lr_warmup_steps: 1000
    lr_scheduler: "openpi_cosine"
    num_cycles: 0.5
    min_lr: 0.0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    use_orig_params: True
    gradient_checkpointing: True
    gradient_checkpointing_use_reentrant: False
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32

reward:
  use_reward_model: False

critic:
  use_critic_model: False
