env_type: realworld

total_num_envs: 1
auto_reset: True
ignore_terminations: False
reward_mode: raw
wrap_obs_mode: simple
seed: 0
group_size: 1
use_fixed_reset_state_ids: False
max_steps_per_rollout_epoch: 300
max_episode_steps: 300
use_spacemouse: False
use_gello: False
use_pico: False
rlt_intervention_metadata: True
main_image_key: image
# Preserve physical camera semantics; do not infer left/right from dict sorting.
extra_image_keys: [wrist_image, side_image]

video_cfg:
  save_video: False
  info_on_video: True
  video_base_dir: ${runner.logger.log_path}/video/eval

init_params:
  id: "CobotEnv-v1"
  num_envs: null

override_cfg:
  is_dummy: True
  action_dim: 14
  state_dim: 14
  image_keys: [image, wrist_image, side_image]
  task_description: "pack fruit into a container and pour it out"
  max_num_steps: 300
  controller_factory: null
  rewind_history_chunks: 12
